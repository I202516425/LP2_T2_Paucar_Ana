<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Edición de orden de compra</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
	<div class="container mt-5">
		<div class="card shadow-lg">
			<div class="card-body">
				<h1 class="card-title text-center" th:text="|Orden de compra edición - Nro. ${ordenCompra.nroOrden}|"></h1>
				<div class="row d-flex justify-content-center">
					<div class="col-md-6">
						<form class="row g-2" th:action="@{/ordencompra/guardar}" method="post" th:object="${ordenCompra}">
							<input type="hidden" th:field="*{nroOrden}" />
							<div class="col-md-6 position-relative">
								<label for="proveedor" class="form-label">Proveedor</label>
								<select class="form-select" required th:field="*{proveedor}">
									<option value="" hidden="hidden">--Seleccione--</option>
									<option th:each="item : ${lstProveedores}" th:value="${item.idProveedor}"
										th:text="|${item.ruc} - ${item.razonSocial}|"
										th:selected="${item.idProveedor == ordenCompra.proveedor.idProveedor}"></option>
								</select>
							</div>
							<div class="col-md-6 position-relative">
								<label for="monto" class="form-label">Monto</label>
								<input type="number" class="form-control" step="0.01" placeholder="0.00" th:field="*{monto}"
									required>
							</div>
							<div class="col-md-12 position-relative">
								<label for="direccionEntrega" class="form-label">Dirección de entrega</label>
								<input type="text" class="form-control" placeholder="Ingrese una dirección de entrega"
									th:field="*{direccionEntrega}" required>
							</div>
							<div class="col-md-6 position-relative">
								<label for="fechaEntrega" class="form-label">Fecha de entrega</label>
								<input type="date" class="form-control" th:field="*{fechaEntrega}" required>
							</div>
							<div class="col-md-6 position-relative">
								<label for="estado" class="form-label">Estado</label>
								<select class="form-select" th:field="*{estado}" required>
									<option value="" hidden="hidden">--Seleccione--</option>
									<option value="P" th:selected="${ordenCompra.estado == 'P'}">Pendiente</option>
									<option value="C" th:selected="${ordenCompra.estado == 'C'}">Completado</option>
									<option value="A" th:selected="${ordenCompra.estado == 'A'}">Anulado</option>
								</select>
							</div>
							<div class="col-md-12 d-flex justify-content-between">
								<!-- Botón Regresar -->
								<a th:href="@{/ordencompra/listado}" class="btn btn-outline-dark">
									<i class="fa-solid fa-reply"></i> Regresar
								</a>
								<!-- Botón Guardar -->
								<button type="submit" class="btn btn-primary">
									<i class="fa-solid fa-floppy-disk"></i> Guardar
								</button>
								<!-- Botón Limpiar -->
								<button type="reset" class="btn btn-secondary">
									<i class="fa-solid fa-broom"></i> Limpiar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
